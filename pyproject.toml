[project]
name = "vineyard"
version = "0.2.0"
description = "TUI factory: PRD to multi-stack codebase via Pydantic AI Gateway and Anthropic Managed Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vineyard" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.100.0",
    "claude-agent-sdk>=0.1.40",
    "httpx>=0.27.0",
    "logfire>=2.0",
    "pydantic>=2.6.0",
    "pydantic-ai>=0.0.14",
    "pydantic-evals>=0.0.14",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "textual>=0.80",
    "typer>=0.12",
]

[project.scripts]
vineyard = "vineyard.cli:main"

[project.optional-dependencies]
# Cloud sandbox for the VALIDATE phase. Install with `uv sync --extra e2b`
# (or set VINEYARD_E2B_API_KEY and `uv pip install e2b-code-interpreter`).
e2b = ["e2b-code-interpreter>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.3.0",
    "textual-dev>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vineyard"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
