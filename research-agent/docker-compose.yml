version: "3.8"

services:
  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vineyard-research-agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist generated PDF reports
      - ./outputs:/app/outputs
    # No ports needed - socket mode connects outbound to Slack
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
